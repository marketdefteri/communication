<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>İletişim | Market Defteri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            text-align: center;
        }

        p {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
        }

        label {
            font-size: 14px;
            margin-bottom: 6px;
            display: block;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-bottom: 16px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        footer {
            margin-top: 16px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>İletişim</h1>
        <p>Görüş, öneri veya sorunlarını bize iletebilirsin.</p>

        <!-- FORM -->
        <form action="https://formspree.io/f/XXXXYYYY" method="POST">
            <label>Ad Soyad</label>
            <input type="text" name="name" placeholder="Adınız" required>

            <label>E-posta</label>
            <input type="email" name="email" placeholder="email@ornek.com" required>

            <label>Mesaj</label>
            <textarea name="message" placeholder="Mesajınızı yazın..." required></textarea>

            <!-- Formspree için -->
            <input type="hidden" name="_subject" value="Market Defteri İletişim Mesajı">

            <button type="submit">Mesajı Gönder</button>
        </form>

        <footer>
            © Market Defteri
        </footer>
    </div>
</body>
</html>
