
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim | Market Defteri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            max-width: 420px;
            width: 90%;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #111827;
        }

        p {
            font-size: 15px;
            color: #4b5563;
            margin-bottom: 24px;
        }

        .email {
            display: inline-block;
            background: #e5f0ff;
            color: #2563eb;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
        }

        .email:hover {
            background: #dbeafe;
        }

        footer {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>İletişim</h1>
        <p>
            Görüş, öneri veya destek talepleriniz için<br>
            aşağıdaki e-posta adresi üzerinden bizimle iletişime geçebilirsiniz.
        </p>

        <a class="email" href="mailto:info.marketdefteri@gmail.com">
            info.marketdefteri@gmail.com
        </a>

        <footer>
            © Market Defteri
        </footer>
    </div>
</body>
</html>
